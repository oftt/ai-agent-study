<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的 AI Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #0f172a; color: #e2e8f0;
         height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 20px; background: #1e293b; border-bottom: 1px solid #334155;
           display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 16px; }
  #usage { font-size: 12px; color: #94a3b8; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; max-width: 760px; width: 100%; margin: 0 auto; }
  .msg { margin-bottom: 16px; display: flex; }
  .msg .bubble { max-width: 72%; padding: 10px 14px; border-radius: 12px; line-height: 1.6;
                 white-space: pre-wrap; word-break: break-word; }
  .user { justify-content: flex-end; }
  .user .bubble { background: #2563eb; border-bottom-right-radius: 2px; }
  .ai { justify-content: flex-start; }
  .ai .bubble { background: #334155; border-bottom-left-radius: 2px; }
  .ai .bubble::before { content: "🤖 "; }
  .typing::after { content: "▋"; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #input-row { padding: 14px 20px; background: #1e293b; border-top: 1px solid #334155;
               display: flex; gap: 10px; max-width: 800px; width: 100%; margin: 0 auto; }
  #msg { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #475569;
         background: #0f172a; color: #e2e8f0; font-size: 14px; outline: none; }
  #msg:focus { border-color: #3b82f6; }
  #send { padding: 10px 22px; border: none; border-radius: 8px; background: #2563eb;
          color: #fff; font-size: 14px; cursor: pointer; }
  #send:hover { background: #1d4ed8; }
  #send:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>🤖 我的 AI Agent</h1>
  <span id="usage">用量加载中...</span>
</header>

<div id="chat"></div>

<div id="input-row">
  <input id="msg" placeholder="问我点什么…(能查时间、查天气、算数)" autofocus>
  <button id="send">发送</button>
</div>

<script>
const chat = document.getElementById('chat');
const msgInput = document.getElementById('msg');
const sendBtn = document.getElementById('send');
const sessionId = crypto.randomUUID();

function appendUser(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="bubble"></div>`;
  div.querySelector('.bubble').textContent = text;
  chat.appendChild(div);
  scrollToBottom();
}

function appendAI() {
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = `<div class="bubble typing"></div>`;
  chat.appendChild(div);
  scrollToBottom();
  return div.querySelector('.bubble');
}

function scrollToBottom() { chat.scrollTop = chat.scrollHeight; }

async function loadUsage() {
  try {
    const r = await fetch('/api/usage');
    const d = await r.json();
    document.getElementById('usage').textContent = d.summary;
  } catch (e) {}
}

async function send() {
  const text = msgInput.value.trim();
  if (!text) return;
  msgInput.value = '';
  sendBtn.disabled = true;
  appendUser(text);
  const aiEl = appendAI();

  try {
    // 发请求,读取 SSE 流(ReadableStream 逐块解析)
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      // 按 SSE 的空行分界,逐个解析事件
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const event = buf.slice(0, i);
        buf = buf.slice(i + 2);
        const line = event.split('\n').find(l => l.startsWith('data:'));
        if (!line) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') continue;
        const obj = JSON.parse(data);
        if (obj.delta) {
          aiEl.textContent += obj.delta;      // 打字机效果
          aiEl.classList.remove('typing');
          scrollToBottom();
        }
      }
    }
  } catch (e) {
    aiEl.textContent = '连接失败: ' + e.message;
  }
  aiEl.classList.remove('typing');
  sendBtn.disabled = false;
  loadUsage();
}

sendBtn.addEventListener('click', send);
msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
loadUsage();
</script>
</body>
</html>
